[project]
name = "skyfield"
version = "2.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1", "uvicorn==0.35.0", "pydantic==2.11.7",
  "SQLAlchemy==2.0.43", "alembic==1.16.5",
  "psycopg[binary]==3.2.9", "httpx==0.28.1", "python-multipart==0.0.20",
  "argon2-cffi==25.1.0", "email-validator==2.3.0",
  "pandas==2.3.2", "numpy==2.2.6", "jinja2==3.1.6",
  "playwright==1.55.0", "plotly==6.3.0", "kaleido==1.1.0",
  "Pillow==13.0.0", "pypdf==6.4.0"
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
