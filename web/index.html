<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#347b62"><meta name="description" content="SkyField by the Jupiter team combines NASA climate data, weather forecasts, soils and agricultural budgets for Santa Cruz, Bolivia.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>SkyField · Agricultural planning</title></head>
<body><div id="root"><main style="max-width:38rem;margin:15vh auto;padding:24px;font:16px Arial,sans-serif;color:#163629">
<h1>Opening SkyField</h1><p>Connecting to your agricultural planning workspace…</p>
<p id="boot-status" role="status">The first connection may take a moment while the free hosting starts.</p>
<button type="button" onclick="location.reload()" style="padding:12px 20px;cursor:pointer">Reload</button>
<noscript><p>Enable JavaScript in your browser to use maps and analysis.</p></noscript>
</main></div>
<script>
window.addEventListener('error', function(event) {
  if (event.target && event.target.tagName === 'SCRIPT') {
    var status = document.getElementById('boot-status');
    if (status) status.textContent = 'Some resources could not be downloaded. Check your connection and select Reload.';
  }
}, true);
window.addEventListener('vite:preloadError', function(event) {
  var previous = Number(sessionStorage.getItem('jupiter-asset-reload') || 0);
  if (Date.now() - previous > 60000) {
    event.preventDefault();
    sessionStorage.setItem('jupiter-asset-reload', String(Date.now()));
    location.reload();
  }
});
</script><script type="module" src="/src/main.tsx"></script></body></html>
